<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16131f"/><stop offset="1" stop-color="#1f1b2e"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b84a8"/></marker>
